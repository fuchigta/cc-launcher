[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.github.username %} ([#{{ commit.github.pr_number }}]({{ commit.github.pr_url }}) by @{{ commit.github.username }}){% endif %}

{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []
commit_parsers = [
  { message = "^feat", group = "新機能" },
  { message = "^fix", group = "バグ修正" },
  { message = "^perf", group = "パフォーマンス改善" },
  { message = "^refactor", group = "リファクタリング" },
  { message = "^docs", group = "ドキュメント" },
  { message = "^test", group = "テスト" },
  { message = "^chore", group = "その他" },
  { message = "^ci", group = "CI/CD" },
  { message = "^build", group = "ビルド" },
  { message = ".*", group = "その他" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
