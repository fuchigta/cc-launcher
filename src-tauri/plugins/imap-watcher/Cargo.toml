[package]
name = "imap-watcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "imap-watcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
imap = "2"
native-tls = "0.2"
mailparse = "0.15"
regex = "1"
chrono = "0.4"
