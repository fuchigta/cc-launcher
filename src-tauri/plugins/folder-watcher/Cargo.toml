[package]
name = "folder-watcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "folder-watcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
notify = "8"
notify-debouncer-full = "0.5"
globset = "0.4"
chrono = "0.4"
