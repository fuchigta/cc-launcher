[workspace]
members = [".", "plugins/folder-watcher", "plugins/imap-watcher"]

[package]
name = "cc-launcher"
version = "0.17.11"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "cc-launcher"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio-cron-scheduler = "0.13"
thiserror = "2"
ts-rs = { version = "10", features = ["chrono-impl", "serde-json-impl"] }
clap = { version = "4", features = ["derive"] }
notify = "8"

[[bin]]
name = "cc-launcher-cli"
path = "src/bin/cli.rs"

