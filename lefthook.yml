commit-msg:
  commands:
    conventional:
      run: bash scripts/check-commit-msg.sh {1}

pre-commit:
  parallel: true
  commands:
    ts-check:
      glob: "src/**/*.{ts,tsx}"
      run: pnpm ts:typecheck && pnpm ts:lint && pnpm ts:fmt:check
    rs-check:
      glob: "src-tauri/**/*.rs"
      run: pnpm rs:lint && pnpm rs:fmt:check
    ts-generate:
      glob: "src-tauri/src/{models,config}.rs"
      run: pnpm ts:generate && git add src-tauri/bindings/
    js-check:
      glob: "scripts/**/*.{js,mjs}"
      run: pnpm js:lint && pnpm js:fmt:check
