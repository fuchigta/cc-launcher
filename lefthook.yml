pre-commit:
  parallel: true
  commands:
    ts-check:
      glob: "src/**/*.{ts,tsx}"
      run: pnpm ts:typecheck && pnpm ts:lint && pnpm ts:fmt:check
    rs-check:
      glob: "src-tauri/**/*.rs"
      run: pnpm rs:lint && pnpm rs:fmt:check
    js-check:
      glob: "scripts/**/*.{js,mjs}"
      run: pnpm js:lint && pnpm js:fmt:check
