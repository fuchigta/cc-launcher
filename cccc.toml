# cccc (https://github.com/moznion/cccc) の設定
# 認知的複雑度・循環的複雑度のゲート。CI の complexity ジョブで使用する。
#
# 閾値は「現状より悪化させない」ためのラチェット。
# 標準的な閾値 (cognitive 15 / cyclomatic 10) では既存コードが落ちるため、
# 2026-11-16 時点の実測値 (61 ファイル・847 関数) の max + 2 に置いている:
#   - 認知的複雑度 max 19 (src-tauri/plugins/imap-watcher の extract_body_parts)
#   - 循環的複雑度 max 13 (src/Settings.tsx の handleShortcutKeyDown)
# リファクタリングで max が下がったら、この閾値も下げていくこと。

max-cognitive = 21
max-cyclomatic = 15
