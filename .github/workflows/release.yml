name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Configure git line endings
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Create plugin binary stubs for test
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/plugins/bin
          New-Item -ItemType File -Force -Path src-tauri/plugins/bin/folder-watcher.exe
          New-Item -ItemType File -Force -Path src-tauri/plugins/bin/imap-watcher.exe
          New-Item -ItemType Directory -Force -Path src-tauri/cli/bin
          New-Item -ItemType File -Force -Path src-tauri/cli/bin/cc-launcher-cli.exe
          New-Item -ItemType Directory -Force -Path src-tauri/context-menu-handler/bin
          New-Item -ItemType File -Force -Path src-tauri/context-menu-handler/bin/context_menu_handler.dll
        shell: pwsh

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Run tests
        run: pnpm test:all

      - name: Generate release notes
        id: release_notes
        run: |
          git cliff --latest --strip all -o release_notes.txt
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Claude Code Launcher v__VERSION__'
          releaseBody: ${{ steps.release_notes.outputs.content }}
          releaseDraft: false
          prerelease: false
